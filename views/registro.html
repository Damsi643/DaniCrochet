<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta - Dani Crochet</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/login.css" />
  <link rel="stylesheet" href="/css/registro.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="logo" href="/">Dani Crochet</a>
      <ul class="nav-links">
        <li><a href="/catalogo">Catálogo</a></li>
        <li><a href="/carrito">Carrito</a></li>
        <li><a href="/login">Ingresar</a></li>
      </ul>
    </div>
  </nav>

  <main class="registro-main">
    <h2 class="seccion" style="text-align:center">Crear cuenta</h2>
    <form class="formulario formulario-registro" id="form-registro">
      <div class="alerta" id="alerta"></div>
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" required minlength="2" maxlength="120" />
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" required maxlength="120" />
      <label for="password">Contraseña</label>
      <input type="password" id="password" required minlength="8" />
      <button type="submit" class="btn">Registrarse</button>
      <p>¿Ya tienes cuenta? <a href="/login?return=/carrito">Inicia sesión</a></p>
    </form>
  </main>

  <footer>Dani Crochet &copy; 2026 - Productos artesanales</footer>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('form-registro').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const alerta = document.getElementById('alerta');
      try {
        await fetchJSON('/api/auth/registro', {
          method: 'POST',
          body: JSON.stringify({
            nombre: document.getElementById('nombre').value.trim(),
            correo: document.getElementById('correo').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        window.location.href = new URLSearchParams(window.location.search).get('return') || '/carrito';
      } catch (error) {
        alerta.className = 'alerta error';
        alerta.textContent = error.message;
      }
    });
  </script>
</body>
</html>
