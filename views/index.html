<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dani Crochet - Inicio</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#c97b84" />
  <link rel="icon" href="/img/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/index.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="logo" href="/">Dani Crochet</a>
      <ul class="nav-links">
        <li><a href="/" class="activo">Inicio</a></li>
        <li><a href="/catalogo">Catálogo</a></li>
        <li><a href="/carrito">Carrito <span class="badge-carrito" data-badge-carrito style="display:none">0</span></a></li>
        <li><a href="/login">Ingresar</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="hero">
      <div class="hero-logo"><span>Dani<br>crochet</span></div>
      <h1>¡Bienvenida a Dani Crochet!</h1>
      <p>Hola, un gusto en atenderte 💗 Descubre el arte del crochet con creaciones hechas a mano, llenas de amor, color y calidez.</p>
      <a class="btn" href="/catalogo">Ver catálogo</a>
    </section>

    <section>
      <h2 class="seccion">Destacados</h2>
      <div class="grid-productos" id="destacados"></div>
    </section>
  </main>

  <footer>Dani Crochet &copy; 2026 - Productos artesanales</footer>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const contenedor = document.getElementById('destacados');
      try {
        const productos = await fetchJSON('/api/productos');
        contenedor.innerHTML = productos
          .slice(0, 3)
          .map(
            (p) => `
            <article class="tarjeta">
              <img src="${p.imagen}" alt="${p.nombre}" onerror="this.src='/img/placeholder.svg'" />
              <div class="contenido">
                <h3>${p.nombre}</h3>
                <span class="precio">${formatearPrecio(p.precio)}</span>
                <div class="acciones">
                  <a class="btn secundario" href="/producto?id=${p.id}">Ver más</a>
                </div>
              </div>
            </article>`
          )
          .join('');
      } catch {
        contenedor.innerHTML =
          '<p class="mensaje-vacio">No se pudieron cargar los productos.</p>';
      }
    });
  </script>
</body>
</html>
