<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar - Dani Crochet</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#c97b84" />
  <link rel="icon" href="/img/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="logo" href="/">Dani Crochet</a>
      <ul class="nav-links">
        <li><a href="/">Inicio</a></li>
        <li><a href="/catalogo">Catálogo</a></li>
        <li><a href="/carrito">Carrito <span class="badge-carrito" data-badge-carrito style="display:none">0</span></a></li>
        <li><a href="/login" class="activo">Ingresar</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <h2 class="seccion" style="text-align:center">Iniciar sesión</h2>
    <form class="formulario" id="form-login">
      <div class="alerta" id="alerta"></div>
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" required placeholder="tu@correo.com" />
      <label for="password">Contraseña</label>
      <input type="password" id="password" required placeholder="••••••••" />
      <button type="submit" class="btn">Ingresar</button>
      <p>¿No tienes cuenta? <a href="/registro?return=/carrito">Regístrate</a></p>
    </form>
  </main>

  <footer>Dani Crochet &copy; 2026 - Productos artesanales</footer>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('form-login');
      const alerta = document.getElementById('alerta');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const correo = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          await fetchJSON('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({ correo, password }),
          });
          const sesion = await fetchJSON('/api/auth/session');
          window.location.href = sesion.usuario.rol === 'admin'
            ? '/admin'
            : new URLSearchParams(window.location.search).get('return') || '/carrito';
        } catch (err) {
          alerta.className = 'alerta error';
          alerta.textContent = err.message;
        }
      });
    });
  </script>
</body>
</html>
