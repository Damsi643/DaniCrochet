<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producto - Dani Crochet</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#c97b84" />
  <link rel="icon" href="/img/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/producto.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="logo" href="/">Dani Crochet</a>
      <ul class="nav-links">
        <li><a href="/">Inicio</a></li>
        <li><a href="/catalogo">Catálogo</a></li>
        <li><a href="/carrito">Carrito <span class="badge-carrito" data-badge-carrito style="display:none">0</span></a></li>
        <li><a href="/login">Ingresar</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div id="detalle-producto"></div>
  </main>

  <footer>Dani Crochet &copy; 2026 - Productos artesanales</footer>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const contenedor = document.getElementById('detalle-producto');
      const id = new URLSearchParams(window.location.search).get('id');

      if (!id) {
        contenedor.innerHTML =
          '<p class="mensaje-vacio">Producto no especificado. <a href="/catalogo">Volver al catálogo</a></p>';
        return;
      }

      try {
        const p = await fetchJSON(`/api/productos/${id}`);
        contenedor.innerHTML = `
          <div class="detalle-producto">
            <img src="${p.imagen}" alt="${p.nombre}" onerror="this.src='/img/placeholder.svg'" />
            <div class="info">
              <h1>${p.nombre}</h1>
              <span class="precio">${formatearPrecio(p.precio)}</span>
              <p class="descripcion">${p.descripcion || 'Sin descripción.'}</p>
              <p class="stock">${p.stock > 0 ? `${p.stock} unidades disponibles` : 'Producto agotado'}</p>
              <div class="cantidad">
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" min="1" max="${Math.max(p.stock, 1)}" value="1" />
              </div>
              <button class="btn" id="btn-agregar" ${p.stock === 0 ? 'disabled' : ''}>Agregar al carrito</button>
            </div>
          </div>`;

        document.getElementById('btn-agregar').addEventListener('click', () => {
          const cantidad = Number(document.getElementById('cantidad').value) || 1;
          agregarAlCarrito(p, cantidad);
          const boton = document.getElementById('btn-agregar');
          boton.textContent = '¡Agregado!';
          setTimeout(() => (boton.textContent = 'Agregar al carrito'), 1200);
        });
      } catch (err) {
        contenedor.innerHTML = `<p class="mensaje-vacio">${err.message}. <a href="/catalogo">Volver al catálogo</a></p>`;
      }
    });
  </script>
</body>
</html>
