<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Dani Crochet Admin</title>
    <link rel="icon" href="/img/icon-192.png">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

    <nav class="admin-nav">
        <div class="container">
            <a class="logo" href="/admin">Dani Crochet <span>· Admin</span></a>
            <ul class="nav-links nav-admin">
                <li><a href="/admin">Inicio</a></li>
                <li><a href="/admin/productos">Productos</a></li>
                <li><a href="/admin/pedidos" class="activo">Pedidos</a></li>
                <li><a href="/admin/clientes">Clientes</a></li>
                <li><a href="/admin/inventario">Inventario</a></li>
                <li><a href="/admin/pagos">Pagos</a></li>
                <li><button type="button" class="btn-salir" id="btn-salir">Cerrar sesión</button></li>
            </ul>
        </div>
    </nav>

    <main class="admin-main">

        <h1 class="titulo">Pedidos</h1>

        <section class="panel">
            <div class="tabla-contenedora">
                <table class="tabla-admin">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Pago</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-pedidos">
                        <tr><td colspan="7" class="mensaje-vacio-mini">Cargando pedidos...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- MODAL DETALLE -->

    <div class="modal-fondo" id="modal-detalle" style="display:none">
        <div class="modal">
            <button type="button" class="modal-cerrar" data-cerrar-modal="modal-detalle">×</button>
            <h2>Pedido <span id="detalle-id"></span></h2>
            <div id="detalle-contenido"></div>
        </div>
    </div>

    <footer>Dani Crochet &copy; 2026 - Panel administrativo</footer>

    <script src="/js/app.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        const ESTADOS = [
            'Pendiente',
            'Confirmado',
            'En preparación',
            'Entregado',
            'Cancelado',
        ];

        document.addEventListener('DOMContentLoaded', cargarPedidos);

        async function cargarPedidos() {
            const cuerpo = document.getElementById('tabla-pedidos');
            try {
                var pedidos = await fetchJSON('/api/pedidos');
            } catch (err) {
                cuerpo.innerHTML = `<tr><td colspan="7" class="mensaje-vacio-mini">${err.message}</td></tr>`;
                return;
            }

            if (pedidos.length === 0) {
                cuerpo.innerHTML =
                    '<tr><td colspan="7" class="mensaje-vacio-mini">Aún no hay pedidos registrados.</td></tr>';
                return;
            }

            cuerpo.innerHTML = pedidos
                .map(
                    (p) => `
                    <tr>
                        <td>#${p.id}</td>
                        <td>${p.cliente ? p.cliente.nombre : '-'}</td>
                        <td>${formatearFecha(p.createdAt)}</td>
                        <td>${formatearPrecio(p.total)}</td>
                        <td>${badgeEstado(p.estado)}</td>
                        <td>${p.pago ? badgeEstado(p.pago.estado) : '-'}</td>
                        <td>
                            <div class="acciones-celda">
                                <button type="button" class="btn-mini btn-editar" data-ver="${p.id}">Ver</button>
                                <select class="estado-select" data-cambiar="${p.id}">
                                    ${ESTADOS.map(
                                        (e) =>
                                            `<option value="${e}" ${e === p.estado ? 'selected' : ''}>${e}</option>`
                                    ).join('')}
                                </select>
                            </div>
                        </td>
                    </tr>`
                )
                .join('');
        }

        document.addEventListener('click', async (e) => {
            const ver = e.target.closest('[data-ver]');
            if (ver) {
                await mostrarDetalle(Number(ver.dataset.ver));
            }
        });

        document.addEventListener('change', async (e) => {
            const select = e.target.closest('[data-cambiar]');
            if (!select) return;

            const id = Number(select.dataset.cambiar);
            const estado = select.value;

            try {
                await fetchJSON(`/api/pedidos/${id}/estado`, {
                    method: 'PATCH',
                    body: JSON.stringify({ estado }),
                });
                alert(`Pedido #${id} actualizado a "${estado}".`);
                cargarPedidos();
            } catch (err) {
                alert(err.message);
                cargarPedidos();
            }
        });

        async function mostrarDetalle(id) {
            try {
                const p = await fetchJSON(`/api/pedidos/${id}`);
                document.getElementById('detalle-id').textContent = `#${p.id}`;

                const items = (p.detalles || [])
                    .map(
                        (d) => `
                        <li>
                            <span>${d.cantidad} × ${d.nombreProducto}</span>
                            <strong>${formatearPrecio(d.subtotal)}</strong>
                        </li>`
                    )
                    .join('');

                document.getElementById('detalle-contenido').innerHTML = `
                    <ul class="detalle-lista">
                        <li><span>Cliente</span><strong>${p.cliente ? p.cliente.nombre : '-'}</strong></li>
                        <li><span>Correo</span><strong>${p.cliente ? p.cliente.correo : '-'}</strong></li>
                        <li><span>Teléfono</span><strong>${p.cliente && p.cliente.telefono ? p.cliente.telefono : '-'}</strong></li>
                        <li><span>Fecha</span><strong>${formatearFecha(p.createdAt)}</strong></li>
                        <li><span>Estado</span>${badgeEstado(p.estado)}</li>
                        <li><span>Pago</span>${p.pago ? badgeEstado(p.pago.estado) + ' · ' + formatearPrecio(p.pago.monto) : '-'}</li>
                    </ul>
                    <ul class="detalle-lista">${items}</ul>
                    <p style="text-align:right"><strong>Total: ${formatearPrecio(p.total)}</strong></p>
                `;

                abrirModal('modal-detalle');
            } catch (err) {
                alert(err.message);
            }
        }
    </script>

</body>
</html>
